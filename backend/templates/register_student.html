<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student</title>
    <style>
        /* General Styles */
        body {
            background: url('college-background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            overflow-y: auto;
        }

        /* Faded background effect */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7); /* Light fade effect */
            z-index: -1;
        }

        /* Form Container */
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 12px;
            width: 360px;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 15px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        input, select {
            background-color: #fff;
            color: #333;
        }

        button {
            cursor: pointer;
            font-weight: bold;
            border: none;
        }

        .start-camera {
            background-color: #007bff;
            color: white;
            transition: 0.3s;
        }

        .start-camera:hover {
            background-color: #0056b3;
        }

        .disabled {
            background-color: #ccc;
            color: #777;
            cursor: not-allowed;
        }

        /* Video Container */
        .video-container {
            display: none;
            justify-content: center;
            margin-top: 10px;
        }

        video {
            width: 100%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        /* Progress Bar */
        .progress-container {
            display: none;
            width: 100%;
            background-color: #ddd;
            border-radius: 5px;
            margin-top: 10px;
            height: 10px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #007bff;
            border-radius: 5px;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Register Student</h2>
        <form id="register-form">
            <label>ID:</label>
            <input type="text" id="student_id" name="student_id" readonly>

            <label>Name:</label>
            <input type="text" id="name" name="name" required>

            <label>Roll No:</label>
            <input type="text" id="roll_no" name="roll_no" required>

            <label>Room ID:</label>
            <input type="text" id="room_id" name="room_id" required>

            <label>Contact Number:</label>
            <input type="text" id="contact_number" name="contact_number" required>

            <label>Parent's Number:</label>
            <input type="text" id="parents_number" name="parents_number" required>

            <label>Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Emergency Contact:</label>
            <input type="text" id="emergency_contact" name="emergency_contact" required>

            <label>Semester:</label>
            <select id="semester" name="semester" onchange="updateYear()" required>
                <option value="S1">S1</option>
                <option value="S2">S2</option>
                <option value="S3">S3</option>
                <option value="S4">S4</option>
                <option value="S5">S5</option>
                <option value="S6">S6</option>
                <option value="S7">S7</option>
                <option value="S8">S8</option>
            </select>

            <label>Year:</label>
            <input type="text" id="year" name="year" readonly>

            <label>Stream:</label>
            <select id="stream" name="stream" required>
                <option value="CS">Computer Science & Engineering (CS)</option>
                <option value="CE">Civil Engineering (CE)</option>
                <option value="EC">Electronics & Communication Engineering (EC)</option>
                <option value="ME">Mechanical Engineering (ME)</option>
                <option value="EE">Electrical Engineering (EE)</option>
                <option value="EI">Electronics and Instrumentation (EI)</option>
            </select>

            <button type="button" class="start-camera" onclick="startCamera()">Start Camera</button>
            <button type="button" class="disabled" id="collect-face" disabled onclick="captureFaceData()">Collect Face Data</button>
            <button type="submit" class="disabled" id="register" disabled>Register</button>
        </form>

        <div class="video-container">
            <video id="video" autoplay></video>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetchNextStudentID();
        });

        function fetchNextStudentID() {
            fetch("/get_next_student_id")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("student_id").value = data.next_id;
                })
                .catch(error => console.error("Error fetching student ID:", error));
        }

        function updateYear() {
            const semester = document.getElementById("semester").value;
            const yearMap = { S1: "1", S2: "1", S3: "2", S4: "2", S5: "3", S6: "3", S7: "4", S8: "4" };
            document.getElementById("year").value = yearMap[semester];
        }

        function startCamera() {
            const video = document.getElementById("video");
            const videoContainer = document.querySelector(".video-container");

            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    videoContainer.style.display = "flex";
                    document.getElementById("collect-face").disabled = false;
                    document.getElementById("collect-face").classList.remove("disabled");
                })
                .catch(err => console.log("Error accessing camera:", err));
        }

        document.getElementById("register-form").addEventListener("submit", function (e) {
            e.preventDefault();
            alert("Student registered successfully!");
        });
    </script>
</body>
</html>
