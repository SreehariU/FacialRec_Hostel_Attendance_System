<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Admin Panel</title>
    <style>
      body {
        background-color: #f5f5f5;
        color: #333;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        margin: 0;
        padding-top: 50px;
        background: url("college-background.jpg") no-repeat center center;
        background-size: cover;
        position: relative;
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.8); /* Faded effect */
        z-index: -1;
      }

      .container {
        background-color: rgba(255, 255, 255, 0.9);
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 400px;
        text-align: center;
      }

      h1,
      h2 {
        text-align: center;
        color: #222;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      input,
      button {
        padding: 12px;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
        width: 100%;
      }

      input {
        background-color: #fff;
        color: #333;
      }

      button {
        background-color: #007bff;
        color: white;
        cursor: pointer;
        border: none;
        font-weight: bold;
      }

      button:hover {
        background-color: #0056b3;
      }

      .admin-list {
        margin-top: 30px;
      }

      .admin-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #fff;
        padding: 10px 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
      }

      .remove-btn {
        background-color: #dc3545;
        color: white;
        cursor: pointer;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-size: 0.9rem;
      }

      .remove-btn:hover {
        background-color: #b52b38;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Super Admin Panel</h1>
      <h2>Manage Admin Users</h2>

      <form action="/add_admin" method="POST">
        <input
          type="text"
          name="username"
          placeholder="New admin username"
          required
        />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />
        <button type="submit">Add Admin</button>
      </form>

      <div class="admin-list">
        <h2>Existing Admins</h2>
        {% for admin in admins %}
        <div class="admin-item" id="admin-{{ admin.username }}">
          <span>{{ admin.username }}</span>
          <button
            class="remove-btn"
            onclick="removeAdmin('{{ admin.username }}', event)"
          >
            Remove
          </button>
        </div>
        {% endfor %}
      </div>
    </div>

    <script>
      function removeAdmin(username, event) {
        event.preventDefault();
        fetch("/remove_admin", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: `username=${username}`,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              document.getElementById(`admin-${username}`).remove();
            } else {
              alert("Failed to remove admin.");
            }
          })
          .catch((error) => console.error("Error:", error));
      }
    </script>
  </body>
</html>
