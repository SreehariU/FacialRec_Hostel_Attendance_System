<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Super Admin Panel</title>
  <style>
    :root {
      --primary: #007bff;
      --primary-dark: #0056b3;
      --danger: #dc3545;
      --danger-dark: #b52b38;
      --light-bg: rgba(255, 255, 255, 0.9);
      --input-bg: #fff;
      --text-color: #333;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      --radius: 12px;
      --font: 'Segoe UI', 'Roboto', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: var(--font);
    }

    body {
      background: url("college-background.jpg") no-repeat center center;
      background-size: cover;
      position: relative;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 60px;
      color: var(--text-color);
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      z-index: -1;
    }

    .container {
      background: var(--light-bg);
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: var(--primary-dark);
    }

    h2 {
      font-size: 1.2rem;
      margin: 20px 0 10px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
    }

    input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: var(--radius);
      background-color: var(--input-bg);
      font-size: 1rem;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: var(--radius);
      background-color: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: var(--primary-dark);
    }

    .admin-list {
      margin-top: 30px;
      text-align: left;
    }

    .admin-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border: 1px solid #ddd;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .admin-item span {
      font-weight: 500;
    }

    .remove-btn {
      background-color: var(--danger);
      color: #fff;
      padding: 8px 12px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .remove-btn:hover {
      background-color: var(--danger-dark);
    }

    @media (max-width: 500px) {
      .container {
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Super Admin Panel</h1>
    <h2>Add New Admin</h2>

    <form action="/add_admin" method="POST">
      <input type="text" name="username" placeholder="New admin username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Add Admin</button>
    </form>

    <div class="admin-list">
      <h2>Existing Admins</h2>
      {% for admin in admins %}
      <div class="admin-item" id="admin-{{ admin.username }}">
        <span>{{ admin.username }}</span>
        <button class="remove-btn" onclick="removeAdmin('{{ admin.username }}', event)">
          Remove
        </button>
      </div>
      {% endfor %}
    </div>
  </div>

  <script>
    function removeAdmin(username, event) {
      event.preventDefault();
      fetch("/remove_admin", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `username=${username}`,
      })
        .then((response) => response.json())
        .then((data) => {
          if (data.success) {
            document.getElementById(`admin-${username}`).remove();
          } else {
            alert("Failed to remove admin.");
          }
        })
        .catch((error) => console.error("Error:", error));
    }
  </script>
</body>
</html>
